name: CPV host and legacy converter tests

on:
  push:
    branches: [feature/cpv-player]
    paths:
      - "apps/cpv-player/**"
      - ".github/workflows/cpv-host-tests.yml"
  pull_request:
    paths:
      - "apps/cpv-player/**"
      - ".github/workflows/cpv-host-tests.yml"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install numpy lz4
      - name: Syntax check
        run: |
          python -m py_compile apps/cpv-player/tools/convert.py apps/cpv-player/tools/play.py apps/cpv-player/tools/test_convert.py
          python -m py_compile apps/cpv-player/tools/legacy_converter/convert.py apps/cpv-player/tools/legacy_converter/test_legacy.py
      - name: Converter unit tests
        run: python -m unittest discover -s apps/cpv-player/tools -p 'test_*.py' -v
      - name: Legacy converter tests
        run: python -m unittest discover -s apps/cpv-player/tools/legacy_converter -p 'test_*.py' -v
      - name: Legacy converter CLI smoke test
        run: python apps/cpv-player/tools/legacy_converter/convert.py --help
      - name: CLI help smoke test
        run: |
          python apps/cpv-player/tools/convert.py --help
          python apps/cpv-player/tools/play.py --help
      - name: Calculator global-motion helper test
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            apps/cpv-player/tools/test_motion.cpp \
            -o /tmp/cpv-motion-test
          /tmp/cpv-motion-test
