name: CPV native encoder and host player tests

on:
  push:
    branches: [feature/cpv-player]
    paths:
      - "apps/cpv-player/**"
      - "ui/**"
      - "doc/ui-library/**"
      - ".github/workflows/cpv-host-tests.yml"
  pull_request:
    paths:
      - "apps/cpv-player/**"
      - "ui/**"
      - "doc/ui-library/**"
      - ".github/workflows/cpv-host-tests.yml"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native and host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zlib1g-dev liblz4-dev libdeflate-dev python3-tk
          python -m pip install --upgrade pip
          python -m pip install numpy lz4
      - name: Build native encoder
        run: make -C apps/cpv-player/tools
      - name: UI library host tests
        run: make -C ui/tests clean host-test
      - name: Calculator decoder source compile check
        run: |
          g++ -std=c++11 -ffreestanding -fno-exceptions -fno-rtti -fshort-wchar \
            -Wno-builtin-declaration-mismatch -Wall -Wextra -Werror \
            -Isdk/include -Iui/include -Iapps/cpv-player \
            -c apps/cpv-player/cpv_decoder.cpp -o /tmp/cpv-decoder.o
          g++ -std=c++11 -ffreestanding -fno-exceptions -fno-rtti -fshort-wchar \
            -Wno-builtin-declaration-mismatch -Wno-main -Wall -Wextra -Werror \
            -Isdk/include -Iui/include -Iapps/cpv-player \
            -c apps/cpv-player/main.cpp -o /tmp/cpv-main.o
      - name: Calculator event-countdown tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            apps/cpv-player/tools/test_playback_events.cpp \
            -o /tmp/cpv-playback-events-test
          /tmp/cpv-playback-events-test
      - name: Calculator DEFLATE and LZ4 decoder tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            apps/cpv-player/tools/test_decompress.cpp -lz \
            -o /tmp/cpv-decompress-test
          /tmp/cpv-decompress-test
      - name: Native encoder self-tests
        run: apps/cpv-player/tools/cpv_convert --self-test
      - name: Host decoder and encoder integration tests
        run: |
          python -m py_compile apps/cpv-player/tools/play.py apps/cpv-player/tools/test_encoder.py apps/cpv-player/tools/benchmark_quality.py
          python -m unittest discover -s apps/cpv-player/tools -p 'test_*.py' -v
      - name: Quality benchmark end-to-end smoke test
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=64x48:rate=5:duration=2 \
            -c:v mpeg4 -q:v 3 /tmp/cpv-quality-source.mp4
          python3 apps/cpv-player/tools/benchmark_quality.py \
            /tmp/cpv-quality-source.mp4 \
            --output-dir /tmp/cpv-quality-benchmark \
            --width 32 --height 24 --fps 5
          test "$(find /tmp/cpv-quality-benchmark -maxdepth 1 -name '*.cpv' | wc -l)" -eq 9
          test -s /tmp/cpv-quality-benchmark/summary.csv
          test -s /tmp/cpv-quality-benchmark/manifest.json
      - name: Calculator global-motion helper test
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            apps/cpv-player/tools/test_motion.cpp \
            -o /tmp/cpv-motion-test
          /tmp/cpv-motion-test
