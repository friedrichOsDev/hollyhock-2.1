name: CPV native encoder and host player tests

on:
  push:
    branches: [feature/cpv-player]
    paths:
      - "apps/cpv-player/**"
      - ".github/workflows/cpv-host-tests.yml"
  pull_request:
    paths:
      - "apps/cpv-player/**"
      - ".github/workflows/cpv-host-tests.yml"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native and host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zlib1g-dev liblz4-dev libdeflate-dev python3-tk
          python -m pip install --upgrade pip
          python -m pip install numpy lz4
      - name: Build native encoder
        run: make -C apps/cpv-player/tools
      - name: Native encoder self-tests
        run: apps/cpv-player/tools/cpv_convert --self-test
      - name: Host decoder and encoder integration tests
        run: |
          python -m py_compile apps/cpv-player/tools/play.py apps/cpv-player/tools/test_encoder.py
          python -m unittest discover -s apps/cpv-player/tools -p 'test_*.py' -v
      - name: Calculator global-motion helper test
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            apps/cpv-player/tools/test_motion.cpp \
            -o /tmp/cpv-motion-test
          /tmp/cpv-motion-test
